name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable && corepack pnpm@9.15.0 install --frozen-lockfile
      - run: pipx install httpie && http --version  # so the HTTPie Copy-as-Code snippets run in tests
      - run: corepack pnpm@9.15.0 typecheck
      - run: node scripts/test.mjs
      - run: node scripts/build-web.mjs --check
      - run: corepack pnpm@9.15.0 package
      - run: node scripts/build-cli.mjs
      - name: CLI smoke test against a local server
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          cd test/action && node ../../dist/cli/plainwire.mjs run smoke.http --env ci --junit ../../junit.xml
          grep -q 'tests="2" failures="0" errors="0"' ../../junit.xml
