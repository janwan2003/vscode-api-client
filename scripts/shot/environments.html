<script>
// The environment editor (rendered by the real media/envEditor.js) with a model as src/core/envFile.ts builds it.
const row = (name, value, secret = false) => ({ name, value, secret, orig: { name, secret } });
const ro = (name, readonly, preview, secret = false) => ({ name, readonly, preview, secret, orig: { name, secret } });
const model = { envs: [
  { name: 'dev', orig: 'dev', vars: [row('baseUrl', 'http://localhost:3000'), row('tenant', 'acme-dev'), ro('Security', 'object', '{"Auth":{"github":{"Type":"OAuth2","Grant Type":"Authorization Code","Client ID":"Iv1.8a61f9b3a7aba766",…'), ro('retries', 'number', '3'), row('apiKey', 'demo-test-key-0000', true), row('password', 'correct horse battery staple', true)] },
  { name: '$shared', orig: '$shared', vars: [row('apiVersion', 'v2'), row('userAgent', 'acme-tests/1.0')] },
  { name: 'staging', orig: 'staging', vars: [row('baseUrl', 'https://staging.acme.dev'), row('tenant', 'acme'), row('apiKey', 'demo-live-key-0000', true)] },
  { name: 'prod', orig: 'prod', vars: [row('baseUrl', 'https://api.acme.com'), row('tenant', 'acme'), row('apiKey', 'demo-live-key-0000', true)] },
] };
window.acquireVsCodeApi = () => ({ getState: () => null, setState(){}, postMessage(m){
  if (m.type==='ready') setTimeout(() => {
    window.postMessage({type:'load',model,error:null,notice:null,folders:[{value:'a',label:'(workspace root)'},{value:'b',label:'services/billing'}],folder:'a',
      files:{public:{label:'http-client.env.json',exists:true},private:{label:'http-client.private.env.json',exists:true}},gitignore:'missing',active:'dev'}, '*');
    setTimeout(() => {
      // Pick "dev", reveal the password, and edit a value so the dirty marker shows.
      [...document.querySelectorAll('.ee-env-tab')].find((b) => b.textContent.startsWith('dev')).click();
      setTimeout(() => {
        [...document.querySelectorAll('button.icon')].filter((b) => b.textContent === 'Show')[1].click();
        setTimeout(() => { const v = document.querySelectorAll('input.v')[1]; v.value = 'acme-dev-2'; v.dispatchEvent(new Event('input')); }, 20);
      }, 20);
    }, 30);
  }, 10);
}});
</script><script src="../../media/envEditor.js"></script></body></html>
