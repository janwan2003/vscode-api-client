<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
:root{--vscode-font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--vscode-font-size:13px;--vscode-editor-font-family:"DejaVu Sans Mono",monospace;--vscode-editor-font-size:12.5px;
--vscode-foreground:#cccccc;--vscode-editor-background:#1f1f1f;--vscode-descriptionForeground:#9d9d9d;--vscode-button-background:#0078d4;--vscode-button-foreground:#fff;--vscode-button-hoverBackground:#026ec1;
--vscode-button-secondaryBackground:#313131;--vscode-button-secondaryForeground:#ccc;--vscode-input-background:#313131;--vscode-input-foreground:#ccc;--vscode-input-border:#3c3c3c;--vscode-panel-border:#2b2b2b;
--vscode-focusBorder:#0078d4;--vscode-textLink-foreground:#4daafc;--vscode-badge-background:#616161;--vscode-badge-foreground:#f8f8f8;--vscode-charts-green:#89d185;--vscode-charts-yellow:#cca700;--vscode-charts-blue:#3794ff;--vscode-charts-red:#f14c4c;
--vscode-testing-iconPassed:#73c991;--vscode-panelTitle-activeBorder:#0078d4;--vscode-input-placeholderForeground:#989898}
</style>
<link rel="stylesheet" href="../../media/panel.css"></head><body><div id="app"></div>
<script>
// The Cookies tab of the response view after a login (rendered by the real panel.js).
const req = {method:'POST',url:'{{baseUrl}}/auth/login',title:'Log in',name:'login',headers:[{name:'Content-Type',value:'application/json'}],
 asserts:['status == 200','cookie session exists'],body:'{"email": "{{email}}", "password": "{{$dotenv APP_PASSWORD}}"}'};
const body = JSON.stringify({user:{id:42,email:'ada@example.com'}});
const resp = {status:200,statusText:'OK',headers:[['content-type','application/json'],['set-cookie','session=s%3A9f2c1e7b4d.Qm1; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400'],['set-cookie','csrftoken=Zk3p81tWq; Path=/; SameSite=Strict; Expires=Fri, 20 Nov 2027 12:00:00 GMT'],['set-cookie','onboarding=; Path=/; Max-Age=0']],
 body,bodyEncoding:'utf8',size:body.length,timeMs:84,url:'https://staging.example.com/auth/login',sentCookie:'locale=en'};
window.acquireVsCodeApi = () => ({ getState: () => null, setState(){}, postMessage(m){
  if (m.type==='ready') { window.postMessage({type:'load',request:req,sourceLabel:'http/auth.http',canSave:true,env:'staging',envNames:['dev','staging']}, '*');
    setTimeout(()=>{ window.postMessage({type:'response',response:resp,resolved:{...req,url:resp.url},assertions:[{source:'status == 200',passed:true,actual:'200',message:'passed'},{source:'cookie session exists',passed:true,actual:'"s%3A9f2c1e7b4d.Qm1"',message:'passed'}]}, '*');
      setTimeout(()=>{ [...document.querySelectorAll('button.tab')].find((b)=>b.textContent.startsWith('Cookies')).click(); }, 50); }, 30); }
}});
</script><script src="../../media/panel.js"></script></body></html>
